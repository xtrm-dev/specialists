name: publish

# Publishes @jaggerxtrm/specialists to npm with npm trusted publishing (GitHub OIDC):
# no npm token is stored anywhere. npm must list this repository and this workflow file
# (publish.yml) as the package's trusted publisher. Provenance is attached automatically.
#
# Runs when a v* tag is pushed, or by hand for an existing tag (workflow_dispatch), so a
# tag pushed before this workflow existed can still be published.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v4.0.4'
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "publish: tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Check the plugin versions match package.json
        # Claude Code keys plugin updates on plugin.json "version" (SPECIALISTS-4254).
        run: node scripts/sync-plugin-versions.mjs --check
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild and require the committed dist
        run: |
          NODE_ENV=test bun run build
          git diff --exit-code -- dist/
          test -z "$(git status --porcelain --untracked-files=all -- dist/)"
      - name: Update npm for trusted publishing
        # OIDC trusted publishing needs npm 11.5.1 or later.
        run: npm install -g npm@^11.5.1
      - name: Publish
        run: npm publish --access public
