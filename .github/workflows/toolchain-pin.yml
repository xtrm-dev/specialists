name: toolchain-pin

# The committed `dist/` must byte-match a fresh build, so the BUILDER VERSION is part of the
# package contract, not a developer preference. Three workflows pinned bun 1.3.14 while
# `engines.bun` said `>=1.0.0`, so a 1.3.5 build produced a plausible-looking artifact that
# only failed at package-payload time (SPECIALISTS-455). This job makes that failure local and
# immediate instead.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to rebuild dist on'
        required: true
        default: master
      push:
        description: 'Write the regenerated dist back to the branch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pin:
    name: toolchain pin matches CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned builder from package.json
        id: pin
        run: echo "bun=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: Assert every workflow that builds dist uses the pinned version
        run: |
          pinned="${{ steps.pin.outputs.bun }}"
          echo "package.json pins bun ${pinned}"
          status=0
          for wf in .github/workflows/*.yml; do
            while read -r version; do
              if [ "$version" != "$pinned" ]; then
                echo "::error file=${wf}::builds dist with bun ${version}, but package.json pins ${pinned}"
                status=1
              fi
            done < <(grep -oE 'bun-version: *[0-9]+\.[0-9]+\.[0-9]+' "$wf" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          done
          exit "$status"

      - name: Report the local builder requirement
        run: |
          echo "Build dist with the pinned version so 'git diff --exit-code -- dist/' stays clean:"
          echo "  bun upgrade --to $(node -p "require('./package.json').packageManager.split('@')[1]")"
  # ---------------------------------------------------------------------------------------
  # Regenerate the committed bundle IN CI.
  #
  # The gate that consumes this file (`git diff --exit-code -- dist/`) only accepts bytes
  # produced by the pinned builder in the canonical environment. Reproducing them on a
  # developer machine is not reliable even with the right version, so when a source change
  # legitimately alters `dist`, the bytes come from here.
  #
  # Dispatch-only and explicit: it never runs on push or pull_request, and it only writes when
  # the operator confirms. `contents: write` is scoped to this job.
  regenerate-dist:
    name: rebuild dist in CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild the committed payload
        run: NODE_ENV=test bun run build

      - name: Report what changed
        id: diff
        run: |
          if git diff --quiet -- dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dist already matches a CI build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- dist/
          fi

      - name: Commit regenerated dist
        if: steps.diff.outputs.changed == 'true' && inputs.push == 'true'
        run: |
          git config user.name "xtrm-bot"
          git config user.email "bot@xtrm.dev"
          git add dist/
          git commit -m "build: regenerate dist with the pinned toolchain (bun 1.3.14)"
          git push origin "HEAD:${{ inputs.ref }}"

      - name: Explain when nothing was pushed
        if: steps.diff.outputs.changed != 'true' || inputs.push != 'true'
        run: |
          echo "dist not rewritten. Either it already matches CI, or push was not confirmed." >&2
