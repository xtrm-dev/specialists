name: semantic-cutover-dist

permissions:
  contents: write

on:
  push:
    branches:
      - fix/xtrm-93-specialist-semantic-cutover
    paths:
      - src/**
      - config/**
      - scripts/**
      - package.json
      - bun.lock
      - .github/workflows/semantic-cutover-dist.yml

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build deterministic payload
        run: NODE_ENV=test bun run build
      - name: Commit dist only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/ && test -z "$(git status --porcelain --untracked-files=all -- dist/)"; then
            echo "dist already current"
            exit 0
          fi
          git add dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh dist for Specialist semantic cutover"
          git push origin HEAD:fix/xtrm-93-specialist-semantic-cutover
