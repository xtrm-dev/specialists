name: pi-compat

permissions:
  contents: read

# Detects when a reviewed pi-coding-agent release breaks the spawn flags the runtime passes.
#
# The package name is NOT hardcoded here: it is read from src/activation/pi-sdk.ts, the constant the
# runtime resolves through. This job previously hardcoded @mariozechner/pi-coding-agent and kept
# passing for months while the runtime had already moved to @earendil-works/pi-coding-agent, so it
# was validating a package 21 minor versions behind the one in production (SPECIALISTS-50).
#
# Trigger: weekly cron, PRs that touch the spawn surface, manual dispatch.

on:
  schedule:
    - cron: '0 12 * * 1'  # Mondays 12:00 UTC
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/specialist/script-runner.ts'
      - 'src/pi/session.ts'
      - '.github/workflows/pi-compat.yml'
  workflow_dispatch:
    inputs:
      pi_version:
        # Empty means "derive from the peer range the extension declares", so the default cannot
        # drift from the line the runtime actually loads.
        description: 'pi-coding-agent version to test (default: derived from the peer range)'
        default: ''
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the pi package and version the runtime loads
        id: pi
        env:
          # Empty means "use the peer range the extension declares", so the default moves with the
          # line instead of being a second pin to forget.
          INPUT_PI_VERSION: ${{ inputs.pi_version || '' }}
        run: |
          set -euo pipefail
          PACKAGE="$(grep -oE "PI_SDK_PACKAGE = '[^']+'" src/activation/pi-sdk.ts | sed "s/.*'\(.*\)'/\1/")"
          if [ -z "$PACKAGE" ]; then
            echo "::error title=pi compat::could not read PI_SDK_PACKAGE from src/activation/pi-sdk.ts"
            exit 1
          fi
          DEFAULT_VERSION="$(PACKAGE="$PACKAGE" node -e '
            const pkg = require("./config/pi-extensions/specialist-subagents/package.json");
            const range = (pkg.peerDependencies || {})[process.env.PACKAGE] || "";
            const match = range.match(/[0-9]+\.[0-9]+\.[0-9]+/);
            process.stdout.write(match ? match[0] : "");
          ')"
          VERSION="${INPUT_PI_VERSION:-$DEFAULT_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error title=pi compat::no version given and none derivable from the peer range for $PACKAGE"
            exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing $PACKAGE@$VERSION"

      - name: Install pi
        run: |
          npm install -g "${{ steps.pi.outputs.package }}@${{ steps.pi.outputs.version }}"
          pi --version

      - name: Smoke spawn flags (script-runner path)
        run: |
          set -e
          # Flags src/specialist/script-runner.ts passes TODAY. Re-derived from that file rather
          # than carried over: the previous list checked --no-tools, which the code does not pass,
          # while missing --no-builtin-tools, --offline, --no-skills and others it does.
          REQUIRED=(--append-system-prompt --mode --model --no-context-files --no-extensions \
            --no-prompt-templates --no-session --no-skills --no-themes --offline --skill \
            --system-prompt --thinking --tools)
          HELP="$(pi --help 2>&1)"
          MISSING=()
          for flag in "${REQUIRED[@]}"; do
            if ! grep -qE "(^|[[:space:]])${flag}([[:space:]]|,|$)" <<<"$HELP"; then
              MISSING+=("$flag")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error title=pi compat regression::Required script-runner flags missing from pi --help: ${MISSING[*]}"
            exit 1
          fi
          echo "All required script-runner flags present in pi --help."

      - name: Smoke spawn flags (RPC session path)
        run: |
          set -e
          # Flags src/pi/session.ts passes TODAY (--mode rpc), re-derived from that file.
          REQUIRED=(--append-system-prompt --mode --model --no-builtin-tools --no-context-files \
            --no-extensions --no-prompt-templates --no-session --no-skills --no-themes --offline \
            --provider --skill --system-prompt --thinking --tools)
          HELP="$(pi --help 2>&1)"
          MISSING=()
          for flag in "${REQUIRED[@]}"; do
            if ! grep -qE "(^|[[:space:]])${flag}([[:space:]]|,|$)" <<<"$HELP"; then
              MISSING+=("$flag")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error title=pi compat regression::Required RPC session flags missing from pi --help: ${MISSING[*]}"
            exit 1
          fi
          echo "All required RPC session flags present in pi --help."

      - name: Smoke positional prompt (no '--' separator)
        run: |
          set -e
          # Real spawn with our script-runner args + a model that won't auth-succeed.
          # We expect failure, but failure must NOT be 'Unknown option'.
          STDERR=$(pi --mode json --no-session --no-extensions --no-tools --model "fake/fake" "say hi" 2>&1 >/dev/null || true)
          if grep -qiE "unknown option|invalid argument|unrecognized" <<<"$STDERR"; then
            echo "::error title=pi compat regression::pi rejected our spawn args (positional prompt)"
            echo "$STDERR"
            exit 1
          fi
          echo "pi accepted our spawn args (auth/provider error is fine, args parse is fine)."

      - name: Build image with reviewed pi
        run: |
          docker build \
            --build-arg "PI_PACKAGE=${{ steps.pi.outputs.package }}" \
            --build-arg "PI_VERSION=${{ steps.pi.outputs.version }}" \
            -t specialists-service:ci .

      - name: Container boot smoke
        run: |
          set -e
          CID=$(docker run -d --rm -p 8765:8000 specialists-service:ci --port 8000)
          trap "docker stop $CID >/dev/null 2>&1 || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null 2>&1; then
              echo "Container booted; /healthz green."
              exit 0
            fi
            sleep 1
          done
          echo "::error title=pi compat regression::Container did not become healthy in 20s"
          docker logs "$CID" || true
          exit 1
