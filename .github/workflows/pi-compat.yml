name: pi-compat

permissions:
  contents: read

# Detects when a reviewed pi-coding-agent release breaks the spawn flags the runtime passes.
#
# The package name is NOT hardcoded here: it is read from src/activation/pi-sdk.ts, the constant the
# runtime resolves through. This job previously hardcoded @mariozechner/pi-coding-agent and kept
# passing for months while the runtime had already moved to @earendil-works/pi-coding-agent, so it
# was validating a package 21 minor versions behind the one in production (SPECIALISTS-50).
#
# Trigger: weekly cron, PRs that touch the spawn surface, manual dispatch.

on:
  schedule:
    - cron: '0 12 * * 1'  # Mondays 12:00 UTC
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/specialist/script-runner.ts'
      - 'src/pi/session.ts'
      - '.github/workflows/pi-compat.yml'
  workflow_dispatch:
    inputs:
      pi_version:
        # Empty means "derive from the peer range the extension declares", so the default cannot
        # drift from the line the runtime actually loads.
        description: 'pi-coding-agent version to test (default: derived from the peer range)'
        default: ''
        required: false

jobs:
  # Which pi versions to exercise. Without a dispatch input this runs the peer floor the extension
  # declares AND the current published pi, because the floor alone stayed green while production
  # moved from 0.99 to 1.5 (SPECIALISTS-4431).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose the versions to test
        id: plan
        env:
          REQUESTED: ${{ inputs.pi_version || '' }}
        run: |
          set -euo pipefail
          # The dispatch input is the only attacker-controlled value here. It never reaches a shell
          # through an expression and must be semver before it becomes a matrix row (SPECIALISTS-4438).
          SEMVER_RE='^(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ $SEMVER_RE ]]; then
              echo "::error title=pi compat::pi_version must be a semver release (got: ${REQUESTED})"
              exit 1
            fi
            printf 'matrix=[{"label":"requested","version":"%s"}]\n' "$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            # peer-floor: the lowest version the peer range declares.
            # pinned: the Dockerfile's default, so the pin is always exercised even after npm moves.
            # current: whatever npm serves today.
            printf 'matrix=[{"label":"peer-floor","version":""},{"label":"pinned","version":"pinned"},{"label":"current","version":"current"}]\n' >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: smoke (${{ matrix.label }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve the pi package and version the runtime loads
        id: pi
        env:
          # Empty means "use the peer range the extension declares", so the default moves with the
          # line instead of being a second pin to forget. "current" means the published latest.
          INPUT_PI_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          PACKAGE="$(grep -oE "PI_SDK_PACKAGE = '[^']+'" src/activation/pi-sdk.ts | sed "s/.*'\(.*\)'/\1/")"
          if [ -z "$PACKAGE" ]; then
            echo "::error title=pi compat::could not read PI_SDK_PACKAGE from src/activation/pi-sdk.ts"
            exit 1
          fi
          DEFAULT_VERSION="$(PACKAGE="$PACKAGE" node -e '
            const pkg = require("./config/pi-extensions/native-specialists/package.json");
            const range = (pkg.peerDependencies || {})[process.env.PACKAGE] || "";
            const match = range.match(/[0-9]+\.[0-9]+\.[0-9]+/);
            process.stdout.write(match ? match[0] : "");
          ')"
          PINNED_VERSION="$(grep -oE '^ARG PI_VERSION=[^[:space:]]+' Dockerfile | cut -d= -f2)"
          case "$INPUT_PI_VERSION" in
            '') VERSION="$DEFAULT_VERSION" ;;
            pinned)
              if [ -z "$PINNED_VERSION" ]; then
                echo "::error title=pi compat::could not read ARG PI_VERSION from the Dockerfile"
                exit 1
              fi
              VERSION="$PINNED_VERSION"
              ;;
            current)
              VERSION="$(npm view "$PACKAGE" version 2>/dev/null | tail -n 1)"
              if [ -z "$VERSION" ]; then
                echo "::error title=pi compat::could not resolve the current published version of $PACKAGE"
                exit 1
              fi
              ;;
            *) VERSION="$INPUT_PI_VERSION" ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "::error title=pi compat::no version given and none derivable from the peer range for $PACKAGE"
            exit 1
          fi
          # Every path — dispatch input, Dockerfile ARG, npm tag — lands on the same gate before the
          # version is used in a command (SPECIALISTS-4438).
          SEMVER_RE='^(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error title=pi compat::refusing a pi version that is not semver: ${VERSION}"
            exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing $PACKAGE@$VERSION"

      - name: Install pi
        env:
          PI_PACKAGE: ${{ steps.pi.outputs.package }}
          PI_VERSION: ${{ steps.pi.outputs.version }}
        run: |
          set -euo pipefail
          npm install -g "${PI_PACKAGE}@${PI_VERSION}"
          pi --version

      - name: Smoke spawn flags (script-runner path)
        run: |
          set -e
          # Flags src/specialist/script-runner.ts passes TODAY. Re-derived from that file rather
          # than carried over: the previous list checked --no-tools, which the code does not pass,
          # while missing --no-builtin-tools, --offline, --no-skills and others it does.
          REQUIRED=(--append-system-prompt --mode --model --no-context-files --no-extensions \
            --no-prompt-templates --no-session --no-skills --no-themes --offline --skill \
            --system-prompt --thinking --tools)
          HELP="$(pi --help 2>&1)"
          MISSING=()
          for flag in "${REQUIRED[@]}"; do
            if ! grep -qE "(^|[[:space:]])${flag}([[:space:]]|,|$)" <<<"$HELP"; then
              MISSING+=("$flag")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error title=pi compat regression::Required script-runner flags missing from pi --help: ${MISSING[*]}"
            exit 1
          fi
          echo "All required script-runner flags present in pi --help."

      - name: Smoke spawn flags (RPC session path)
        run: |
          set -e
          # Flags src/pi/session.ts passes TODAY (--mode rpc), re-derived from that file.
          REQUIRED=(--append-system-prompt --mode --model --no-builtin-tools --no-context-files \
            --no-extensions --no-prompt-templates --no-session --no-skills --no-themes --offline \
            --provider --skill --system-prompt --thinking --tools)
          HELP="$(pi --help 2>&1)"
          MISSING=()
          for flag in "${REQUIRED[@]}"; do
            if ! grep -qE "(^|[[:space:]])${flag}([[:space:]]|,|$)" <<<"$HELP"; then
              MISSING+=("$flag")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error title=pi compat regression::Required RPC session flags missing from pi --help: ${MISSING[*]}"
            exit 1
          fi
          echo "All required RPC session flags present in pi --help."

      - name: Smoke positional prompt (no '--' separator)
        run: |
          set -e
          # Real spawn with our script-runner args + a model that won't auth-succeed.
          # We expect failure, but failure must NOT be 'Unknown option'.
          STDERR=$(pi --mode json --no-session --no-extensions --no-tools --model "fake/fake" "say hi" 2>&1 >/dev/null || true)
          if grep -qiE "unknown option|invalid argument|unrecognized" <<<"$STDERR"; then
            echo "::error title=pi compat regression::pi rejected our spawn args (positional prompt)"
            echo "$STDERR"
            exit 1
          fi
          echo "pi accepted our spawn args (auth/provider error is fine, args parse is fine)."

      # The image default is pinned (SPECIALISTS-4437). Build THROUGH that pin whenever the version
      # under test is the pinned one, so CI exercises the default a consumer actually gets; only an
      # older/newer version under test is passed as a build arg.
      - name: Pin matches the declared pi
        run: bun scripts/check-pi-pin-sync.ts

      - name: Build image with reviewed pi
        env:
          PI_PACKAGE: ${{ steps.pi.outputs.package }}
          PI_VERSION: ${{ steps.pi.outputs.version }}
        run: |
          set -euo pipefail
          PINNED="$(grep -oE '^ARG PI_VERSION=[^[:space:]]+' Dockerfile | cut -d= -f2)"
          PINNED_PACKAGE="$(grep -oE '^ARG PI_PACKAGE=[^[:space:]]+' Dockerfile | cut -d= -f2)"
          if [ "${PI_VERSION}" = "$PINNED" ] && [ "${PI_PACKAGE}" = "$PINNED_PACKAGE" ]; then
            echo "Building the pinned default: ${PINNED_PACKAGE}@${PINNED}"
            docker build -t specialists-service:ci .
          else
            echo "Building ${PI_PACKAGE}@${PI_VERSION} over the pinned ${PINNED_PACKAGE}@${PINNED}"
            docker build \
              --build-arg "PI_PACKAGE=${PI_PACKAGE}" \
              --build-arg "PI_VERSION=${PI_VERSION}" \
              -t specialists-service:ci .
          fi

      - name: Image carries the version under test
        env:
          PI_PACKAGE: ${{ steps.pi.outputs.package }}
          PI_VERSION: ${{ steps.pi.outputs.version }}
        run: |
          set -euo pipefail
          INSTALLED="$(docker run --rm --entrypoint npm specialists-service:ci ls -g --depth=0 \
            | grep -oE 'pi-coding-agent@[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d@ -f2)"
          if [ "$INSTALLED" != "${PI_VERSION}" ]; then
            echo "::error title=pi compat regression::image carries pi ${INSTALLED:-nothing}, expected ${PI_VERSION}"
            exit 1
          fi
          echo "Image carries ${PI_PACKAGE}@${INSTALLED}."

      - name: Container boot smoke
        run: |
          set -e
          CID=$(docker run -d --rm -p 8765:8000 specialists-service:ci --port 8000)
          trap "docker stop $CID >/dev/null 2>&1 || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null 2>&1; then
              echo "Container booted; /healthz green."
              exit 0
            fi
            sleep 1
          done
          echo "::error title=pi compat regression::Container did not become healthy in 20s"
          docker logs "$CID" || true
          exit 1
