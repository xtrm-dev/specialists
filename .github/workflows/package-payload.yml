name: package-payload

permissions:
  contents: read

on:
  # The release script refuses to tag unless these jobs passed on the exact commit, and a
  # merge commit has no pull_request run, so the gate needs a way to run them there.
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - README.md
      - CHANGELOG.md
      - release-attestation.json
      - tests/integration/release-attestation.test.ts
      - src/**
      - config/**
      - dist/**
      - scripts/assert-package-payload.sh
      - scripts/generate-release-attestation.mjs
      - scripts/postprocess-build.mjs
      - scripts/release-4.2.0.sh
      - scripts/ci-dist-gate.ts
      - .github/workflows/package-payload.yml

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      package_payload: ${{ steps.filter.outputs.package_payload }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            package_payload:
              - package.json
              - README.md
              - CHANGELOG.md
              - release-attestation.json
              - tests/integration/release-attestation.test.ts
              - src/**
              - config/**
              - dist/**
              - scripts/assert-package-payload.sh
              - scripts/generate-release-attestation.mjs
              - scripts/postprocess-build.mjs
              - scripts/release-4.2.0.sh
              - scripts/ci-dist-gate.ts
              - .github/workflows/package-payload.yml

  payload-contract:
    needs: changes
    # A non-PR event has no base to diff against, so paths-filter sees only the last commit and
    # would skip these jobs on the dispatch the release gate relies on.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.package_payload == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: |
          echo 'package-payload: installing dependencies with frozen lockfile'
          bun install --frozen-lockfile
          echo 'package-payload: install succeeded'
      - name: Build package payload
        # One implementation for CI and for contributors (SPECIALISTS-4445): the script rebuilds with
        # the bun .bun-version pins and fails with the cause (__esm wrapper) and the fix, instead of
        # a raw bundle diff that two PRs in a row had to reverse-engineer. setup-bun below is given
        # the same version as a literal, so the version refusal never fires in CI here; the message
        # is the value. Keep .bun-version, these literals and package.json packageManager in step —
        # toolchain-pin.yml checks the latter two, nothing checks .bun-version.
        run: node scripts/check-dist-reproducible.mjs
      - name: Generate npm pack manifest
        run: |
          echo 'package-payload: generating npm pack dry-run manifest'
          npm pack --dry-run --json > /tmp/package-payload.json
          echo 'package-payload: pack manifest generated'
      - name: Assert payload contract
        run: |
          echo 'package-payload: asserting required payload assets'
          if ! scripts/assert-package-payload.sh /tmp/package-payload.json \
            README.md \
            CHANGELOG.md \
            dist/index.js \
            dist/lib.js \
            dist/types/lib.d.ts \
            package.json \
            config/specialists/executor.specialist.json \
            config/specialists/reviewer.specialist.json \
            config/specialists/service-knowledge-sync.specialist.json \
            config/mandatory-rules/executor-delivery.md \
            config/mandatory-rules/index.json \
            config/skills/using-specialists/SKILL.md \
            config/catalog/index.json \
            config/catalog/native.json \
            config/catalog/gitnexus.json \
            config/pi-extensions/extension-tool-policy/index.mjs \
            config/pi-extensions/read-line-numbers/index.mjs \
            config/pi-extensions/read-line-numbers/package.json \
            config/pi-extensions/native-specialists/index.mjs \
            config/pi-extensions/native-specialists/package.json \
            config/workflows/reviewer-chain.agentrun.json \
            dist/postinstall.js \
            scripts/generate-release-attestation.mjs \
            dist/asset-contract.json \
            LICENSE; then
            echo 'package-payload: CONTRACT FAILURE — asserted asset missing from successfully-built payload' >&2
            exit 1
          fi
          if jq -e '.[0].files[] | select(.path == "release-attestation.json")' /tmp/package-payload.json >/dev/null; then
            echo 'package-payload: CONTRACT FAILURE — tracked candidate attestation must remain outside the tarball' >&2
            exit 1
          fi
          echo 'package-payload: contract assertion passed'

  packed-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.package_payload == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, pack, and smoke installed tarball
        run: |
          set -euo pipefail
          # The same guard payload-contract uses, so a bundle built by the wrong bun names the cause
          # here too instead of reporting a raw diff (SPECIALISTS-4445).
          node scripts/check-dist-reproducible.mjs --write
          tarball_name=$(npm pack --pack-destination /tmp --json | jq -r '.[0].filename')
          tarball="/tmp/$tarball_name"
          test "$tarball_name" = "jaggerxtrm-specialists-$(node -p "require('./package.json').version").tgz"
          prefix=/tmp/sp-smoke-prefix
          workdir=$(mktemp -d)
          export PI_CODING_AGENT_DIR=$(mktemp -d)
          npm install -g --prefix="$prefix" "$tarball"
          jq -e --arg p "$prefix/lib/node_modules/@jaggerxtrm/specialists/config/pi-extensions/native-specialists" \
            '.packages | index($p) != null' "$PI_CODING_AGENT_DIR/settings.json"
          export PATH="$prefix/bin:$PATH"
          cd "$workdir"
          sp --version
          sp doctor --check-drift
          sp prune-stale-defaults --dry-run
          sp clean --dry-run
          sp list --compact
          if tar -tzf "$tarball" | grep -qi serena; then echo 'retired Serena surface found' >&2; exit 1; fi
          cd "$GITHUB_WORKSPACE"
          export PI_VERSION=not-run
          npm run release:attest -- "$tarball" /tmp/release-attestation.json
          EXPECTED_SOURCE_COMMIT="$GITHUB_SHA" npm run release:attest -- --validate "$tarball" /tmp/release-attestation.json
          test -s /tmp/release-attestation.json
      - name: Persist release attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-attestation-${{ github.sha }}
          path: /tmp/release-attestation.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
